spring:
  application:
    name: hps-add-option3
  config:
    # Optional local overrides (api-key, base-url) — copy from application-local.yml.example
    import: optional:classpath:application-local.yml
  ai:
    dashscope:
      enabled: false
    openai:
      api-key: ${OPENAI_API_KEY:sk_m2CEX6S0ifz_hEVycxisAvUrXtdQ7VkSU7IUxLE5BK8}
      base-url: ${OPENAI_BASE_URL:https://api.ppio.com/openai}
      chat:
        options:
          model: ${OPENAI_MODEL:pa/gpt-5.4}
          temperature: 1
          top-p: 1
          n: 1
          presence-penalty: 0
          frequency-penalty: 0

supervisor:
  # Set true only when you want the full 4-iteration run on startup (many LLM calls)
  run-examples: false
